name: Release

# Pousser un tag « vMAJEUR.MINEUR.CORRECTIF » (ex. v1.0.0) crée la release GitHub :
# notes tirées de CHANGELOG.md, après vérification que le tag correspond à VERSION.
# Si la release existe déjà (créée à la main sur le site), elle est laissée telle quelle.
on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write
  actions: read                # lire le résultat de la CI sur le commit publié

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Le tag correspond à VERSION
        run: |
          VERSION=$(python -c "import re; print(re.search(r'^VERSION = \"([^\"]+)\"', open('serveur_recettes.py', encoding='utf-8').read(), re.M).group(1))")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Le tag $GITHUB_REF_NAME ne correspond pas à VERSION = $VERSION (serveur_recettes.py)"
            exit 1
          fi
      - name: CI verte sur ce commit (navigateurs, Windows, Python 3.9/3.13)
        # La release ne part que si la CI complète (ci.yml) a réussi sur le commit du tag ; elle attend la fin d'une CI en cours.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          sans_ci=0
          for i in $(seq 1 60); do                                   # jusqu'à ~30 minutes
            etats=$(gh run list --workflow ci.yml --commit "$GITHUB_SHA" --limit 20 \
                      --json status,conclusion --jq '.[] | "\(.status):\(.conclusion)"')
            echo "CI sur $GITHUB_SHA : ${etats:-aucune exécution}" | tr '\n' ' '; echo
            if echo "$etats" | grep -q '^completed:success$'; then echo "CI verte."; exit 0; fi
            if [ -z "$etats" ]; then
              sans_ci=$((sans_ci + 1))
              if [ "$sans_ci" -ge 6 ]; then
                echo "::error::Aucune exécution de la CI sur le commit $GITHUB_SHA. Le tag doit être posé sur un commit de main dont la CI a tourné."
                exit 1
              fi
            elif ! echo "$etats" | grep -qv '^completed:'; then
              echo "::error::La CI a échoué sur le commit $GITHUB_SHA : pas de release. Corrige, puis relance ce workflow."
              exit 1
            fi
            sleep 30
          done
          echo "::error::La CI n'est pas terminée après 30 minutes."
          exit 1
      - name: Dépendance facultative des tests (extraction de PDF)
        run: python -m pip install pdfplumber
      - name: Tests hors ligne
        run: python -m unittest discover -s tests
      - name: Notes de version (CHANGELOG.md)
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v v="$VERSION" '/^## \[/ { if (found) exit; if (index($0, "[" v "]")) { found = 1; next } } found && !/^\[[^]]+\]: /' CHANGELOG.md > notes.md
          if ! grep -q '[^[:space:]]' notes.md; then
            echo "::error::Aucune section « ## [$VERSION] » dans CHANGELOG.md"
            exit 1
          fi
          cat notes.md
      - name: Créer la release (si elle n'existe pas déjà)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Une release créée à la main sur le site (qui crée aussi le tag) est laissée telle quelle.
          if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
            echo "La release $GITHUB_REF_NAME existe déjà (créée à la main) : rien à faire."
            exit 0
          fi
          if ! gh release create "$GITHUB_REF_NAME" --verify-tag \
                 --title "Générateur de recettes $GITHUB_REF_NAME" --notes-file notes.md; then
            # créée entre-temps par quelqu'un d'autre ?
            if gh release view "$GITHUB_REF_NAME" > /dev/null 2>&1; then
              echo "La release $GITHUB_REF_NAME vient d'être créée par ailleurs : rien à faire."
              exit 0
            fi
            exit 1
          fi
      - name: Archive à distribuer (zip) jointe à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python outils/construire_archive.py .
          gh release upload "$GITHUB_REF_NAME" "recettes-$GITHUB_REF_NAME.zip" --clobber

  exe:
    name: recettes.exe (Windows)
    needs: release
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/exe-windows        # construction + essai (étapes communes)
      - name: Joindre l'exécutable à la release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release upload "$env:GITHUB_REF_NAME" (Get-ChildItem recettes-v*.exe).FullName --clobber
