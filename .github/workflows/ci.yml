name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:           # lancement manuel (onglet Actions)

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Vérification statique (pyflakes)
        run: |
          python -m pip install pyflakes
          python -m pyflakes serveur_recettes.py tester_sources.py tests colab
      - name: Tests hors ligne
        run: python -m unittest discover -s tests -v

  interface:
    name: interface (${{ matrix.navigateur }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        navigateur: [chromium, firefox, webkit]       # webkit = moteur de Safari
    env:
      RECETTES_NAVIGATEUR: ${{ matrix.navigateur }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer Playwright et le navigateur
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps ${{ matrix.navigateur }}
      - name: Nom d'hôte de test (monpc.local)
        run: echo "127.0.0.1 monpc.local" | sudo tee -a /etc/hosts
      - name: Tests de l'interface
        run: python -m unittest tests.test_interface -v
