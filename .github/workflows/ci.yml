name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:           # lancement manuel (onglet Actions)

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Vérification statique (pyflakes)
        run: |
          python -m pip install pyflakes
          python -m pyflakes serveur_recettes.py pdf_recettes.py tester_sources.py tests colab outils
      - name: Extraction de PDF (dépendance facultative)
        run: python -m pip install pdfplumber
      - name: Tests hors ligne
        run: python -m unittest discover -s tests -v

  interface:
    name: interface (${{ matrix.navigateur }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        navigateur: [chromium, firefox, webkit]       # webkit = moteur de Safari
    env:
      RECETTES_NAVIGATEUR: ${{ matrix.navigateur }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer Playwright
        run: python -m pip install playwright pdfplumber
      - name: Version de Playwright (clé du cache)
        id: pw
        run: echo "version=$(python -c 'import importlib.metadata as m; print(m.version("playwright"))')" >> "$GITHUB_OUTPUT"
      - name: Navigateurs Playwright en cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ matrix.navigateur }}-${{ steps.pw.outputs.version }}
      - name: Installer le navigateur et ses dépendances système
        # Avec le cache, le navigateur n'est pas retéléchargé ; les paquets système (apt) sont, eux, toujours installés.
        # Le miroir apt d'Ubuntu se fige parfois sur un paquet : on le fait réessayer, puis échouer vite (au lieu de rester bloqué).
        timeout-minutes: 8
        run: |
          printf 'Acquire::Retries "5";\nAcquire::http::Timeout "20";\nAcquire::https::Timeout "20";\n' | sudo tee /etc/apt/apt.conf.d/80-reessais
          # Le miroir Azure servait un paquet de polices en boucle : miroir officiel d'abord, Azure en secours (apt bascule tout seul).
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://azure.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          sudo apt-get update
          python -m playwright install --with-deps ${{ matrix.navigateur }}
      - name: Nom d'hôte de test (monpc.local)
        run: echo "127.0.0.1 monpc.local" | sudo tee -a /etc/hosts
      - name: Tests de l'interface
        run: python -m unittest tests.test_interface -v

  exe-windows:
    name: recettes.exe (Windows)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: ./.github/actions/exe-windows        # construction + essai (étapes communes)
