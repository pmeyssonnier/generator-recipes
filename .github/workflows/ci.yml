name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Vérification statique (pyflakes)
        run: |
          python -m pip install pyflakes
          python -m pyflakes serveur_recettes.py tester_sources.py tests colab
      - name: Tests hors ligne
        run: python -m unittest discover -s tests -v

  interface:
    name: tests de l'interface (Chromium)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Installer Playwright et Chromium
        run: |
          python -m pip install playwright
          python -m playwright install --with-deps chromium
      - name: Tests de l'interface
        run: python -m unittest tests.test_interface -v
